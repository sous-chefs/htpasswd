---
name: ci

"on":
  pull_request:
  push:
    branches: [main]

jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@8.0.4
    with:
      gems: "htauth"
    permissions:
      checks: write
      pull-requests: write
      statuses: write

  integration:
    needs: "lint-unit"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - "almalinux-9"
          - "almalinux-8"
          - "amazonlinux-2023"
          - "centos-stream-9"
          - "debian-12"
          - "fedora-latest"
          - "oraclelinux-8"
          - "oraclelinux-9"
          - "rockylinux-9"
          - "rockylinux-8"
          - "ubuntu-2204"
          - "ubuntu-2404"
        suite:
          - "default"
          - "delete"
          - "overwrite"
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Chef
        uses: sous-chefs/.github/.github/actions/install-workstation@8.0.4
      - name: Dokken
        uses: actionshub/test-kitchen@3.0.0
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}
