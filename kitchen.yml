---
driver:
  name: vagrant

provisioner:
  name: chef_infra
  product_name: chef
  enforce_idempotency: true
  multiple_converge: 2
  deprecations_as_errors: true

verifier:
  name: inspec

platforms:
  - name: almalinux-9
  - name: almalinux-8
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: debian-12
  - name: fedora-latest
  - name: oraclelinux-8
  - name: oraclelinux-9
  - name: rockylinux-9
  - name: rockylinux-8
  - name: ubuntu-22.04
  - name: ubuntu-24.04

x-run_lists:
  default: &default_run_list
    - recipe[test::default]
  delete: &delete_run_list
    - recipe[test::delete]
  overwrite: &overwrite_run_list
    - recipe[test::overwrite]

x-verifiers:
  default: &default_verifier
    inspec_tests:
      - path: test/integration/default
  delete: &delete_verifier
    inspec_tests:
      - path: test/integration/delete
  overwrite: &overwrite_verifier
    inspec_tests:
      - path: test/integration/overwrite

suites:
  - name: default
    named_run_list: default
    run_list: *default_run_list
    verifier: *default_verifier
  - name: delete
    named_run_list: delete
    provisioner:
      enforce_idempotency: false
      multiple_converge: 2
    run_list: *delete_run_list
    verifier: *delete_verifier
  - name: overwrite
    named_run_list: overwrite
    provisioner:
      enforce_idempotency: false
      multiple_converge: 2
    run_list: *overwrite_run_list
    verifier: *overwrite_verifier
